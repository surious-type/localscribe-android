name: LocalScribe UX format handoff
on:
  push:
    branches: [feat/localscribe-library-ux-search]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37
      - name: Install Android build dependencies
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses
          "$sdkmanager" --install 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2'
      - name: Format changed Kotlin files
        run: ./gradlew :app:appKtlintFormat || true
      - name: Generate checked Room schema and check Kotlin types
        run: ./gradlew :app:kspGithubDebugKotlin || true
      - name: Output generated Room schema
        run: |
          python3 - <<'PY'
          import base64, pathlib
          p=pathlib.Path('app/schemas/io.github.surioustype.localscribe.data.LocalScribeDatabase/6.json')
          if p.exists():
              print('UX_SCHEMA_BEGIN ' + str(p))
              print(base64.b64encode(p.read_bytes()).decode())
              print('UX_SCHEMA_END ' + str(p))
          else:
              print('ROOM_SCHEMA_MISSING')
          PY
      - name: Output formatted sources
        run: |
          python3 - <<'PY'
          import base64, subprocess
          paths=subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          for path in paths:
              if path.startswith('app/src/') and path.endswith('.kt'):
                  print('UX_FORMAT_BEGIN ' + path)
                  print(base64.b64encode(open(path,'rb').read()).decode())
                  print('UX_FORMAT_END ' + path)
          PY
