name: Optional Android device tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact Android build dependencies
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses
          "$sdkmanager" --install 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2' 'emulator' 'system-images;android-35;aosp_atd;x86_64'
      - uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic
      - name: Start API 35 software emulator
        run: |
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          echo no | "$avdmanager" create avd --force --name localscribe-api35 --package 'system-images;android-35;aosp_atd;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd localscribe-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > emulator.log 2>&1 &
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; do sleep 5; done
      - name: Run device tests
        run: |
          ./gradlew :app:connectedGithubDebugAndroidTest --stacktrace
          # Native inference skips here: this hosted AVD never receives a model.
          # This workflow never downloads a Whisper model.
