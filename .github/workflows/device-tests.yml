name: Optional Android device tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/device-tests.yml'
      - 'app/src/androidTest/**'
      - 'app/src/main/kotlin/io/github/surioustype/localscribe/ui/**'
      - 'app/src/main/kotlin/io/github/surioustype/localscribe/service/**'
      - 'app/src/main/kotlin/io/github/surioustype/localscribe/audio/**'
      - 'app/src/main/kotlin/io/github/surioustype/localscribe/execution/**'
      - 'app/src/main/kotlin/io/github/surioustype/localscribe/data/**'
      - 'app/src/main/kotlin/io/github/surioustype/localscribe/di/**'
      - 'core/src/main/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/device-tests.yml'
      - 'app/src/androidTest/**'
      - 'app/src/main/kotlin/io/github/surioustype/localscribe/ui/**'
      - 'app/src/main/kotlin/io/github/surioustype/localscribe/service/**'
      - 'app/src/main/kotlin/io/github/surioustype/localscribe/audio/**'

permissions:
  contents: read

# Superseded commits must not keep expensive emulator instances running.
concurrency:
  group: device-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install exact Android build dependencies
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses
          "$sdkmanager" --install 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2' 'emulator' 'system-images;android-35;aosp_atd;x86_64'
      - uses: gradle/actions/wrapper-validation@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
        with:
          cache-provider: basic
      - name: Start API 35 software emulator
        timeout-minutes: 12
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          avdmanager="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/localscribe-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$avdmanager" create avd --force --name localscribe-api35 \
            --path "$ANDROID_AVD_HOME/localscribe-api35.avd" \
            --package 'system-images;android-35;aosp_atd;x86_64'
          # Fail immediately if avdmanager wrote the profile to another HOME.
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx localscribe-api35
          "$ANDROID_HOME/emulator/emulator" -avd localscribe-api35 -no-window -no-audio \
            -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 120 "$ANDROID_HOME/platform-tools/adb" wait-for-device
          for attempt in $(seq 1 72); do
            if [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Android emulator did not complete boot" >&2
          tail -n 100 emulator.log
          exit 1
      - name: Run device tests
        run: |
          ./gradlew :app:connectedGithubDebugAndroidTest --stacktrace
          # Native inference skips here: this hosted AVD never receives a model.
          # This workflow never downloads a Whisper model.
      - name: Upload Android instrumentation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localscribe-android-test-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localscribe-emulator-logs
          path: emulator.log
          if-no-files-found: ignore
